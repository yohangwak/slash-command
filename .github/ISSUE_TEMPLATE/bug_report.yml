name: Bug report
description: Switching did not work, went to the wrong place, or reported something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a security problem (keys sent to the wrong place, screen content leaking), please use a private report instead: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Slash Command version
      description: Shown by Finder ▸ Get Info on the app, or the release you downloaded
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options: [Ghostty, Orca, iTerm2, WezTerm, kitty, Other]
    validations:
      required: true
  - type: input
    id: tmux
    attributes:
      label: Inside tmux?
      description: If yes, the tmux version
  - type: input
    id: agent
    attributes:
      label: Agent and its version
      description: For example "Claude Code 2.1.296". `slashcommand doctor` prints it
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The lines for that key press from `~/Library/Logs/SlashCommand/slashcommand.log`. The log holds no screen text.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `slashcommand doctor --screen`
      description: Optional but very helpful. The README's Command line section shows how to set up the command. The output includes the visible lines of your terminal, so read it and remove anything private before pasting.
      render: text
