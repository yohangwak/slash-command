# Builds Slash-Command-Windows-x64.zip from the tagged source on a GitHub-hosted runner.
# A pushed tag v<version> attaches the zip and its .sha256 to the release of that tag, creating a draft
# when there is none yet. Run by hand (workflow_dispatch) it only builds and keeps the zip as an artifact.
# The build job only reads the repository; the separate publish job is the only one that can write to it.
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      SWIFT_VERSION: 6.4.1
      # From the winget manifest Swift.Toolchain 6.4.1 (x64).
      SWIFT_INSTALLER_SHA256: 9382E14919EEAE5E7B5DBFE0575452FE2154178E089A595C8B44D03960D91D59
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $v = $env:SWIFT_VERSION
          $url = "https://download.swift.org/swift-$v-release/windows10/swift-$v-RELEASE/swift-$v-RELEASE-windows10.exe"
          $exe = Join-Path $env:RUNNER_TEMP 'swift-installer.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($hash -ne $env:SWIFT_INSTALLER_SHA256) { throw "Swift installer sha256 is $hash" }
          $p = Start-Process -FilePath $exe -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Swift installer exited with $($p.ExitCode)" }
          # The installer sets Path and SDKROOT for later sessions; hand them to the next steps.
          foreach ($scope in 'User', 'Machine') {
            foreach ($dir in ([Environment]::GetEnvironmentVariable('Path', $scope) -split ';')) {
              if ($dir -match '\\Swift\\') { Add-Content -Path $env:GITHUB_PATH -Value $dir }
            }
            $sdk = [Environment]::GetEnvironmentVariable('SDKROOT', $scope)
            if ($sdk) { Add-Content -Path $env:GITHUB_ENV -Value "SDKROOT=$sdk" }
          }

      - name: Check the version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          swift --version
          if ($LASTEXITCODE -ne 0) { throw "swift --version failed" }
          $m = Select-String -Path Sources\SlashCommandCore\WindowsAppModel.swift -Pattern 'static let version = "([^"]+)"'
          if (-not $m) { throw "no version in WindowsAppModel.swift" }
          $version = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match version $version"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Test
        shell: pwsh
        run: |
          swift test
          if ($LASTEXITCODE -ne 0) { throw "Tests failed ($LASTEXITCODE)" }

      - name: Build and package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "package-windows.ps1 failed ($LASTEXITCODE)" }
          Get-Content dist\Slash-Command-Windows-x64.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Slash-Command-Windows-x64
          path: |
            dist/Slash-Command-Windows-x64.zip
            dist/Slash-Command-Windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    needs: build
    # A manual run can target a tag too; only a tag push publishes.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Slash-Command-Windows-x64
          path: dist

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json tagName > /dev/null; then
            gh release create "$TAG" --draft --verify-tag --title "Slash Command $APP_VERSION" --notes "Draft created by the Windows release workflow."
          fi
          gh release upload "$TAG" dist/Slash-Command-Windows-x64.zip dist/Slash-Command-Windows-x64.zip.sha256 --clobber
